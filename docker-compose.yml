name: voluma

x-backend-environment: &backend-environment
  VOLUMA_ENVIRONMENT: production
  VOLUMA_MEDIA_ROOT: /var/lib/voluma-media
  VOLUMA_PUBLIC_ORIGIN: ${VOLUMA_PUBLIC_ORIGIN:?Set the canonical HTTPS origin in protected deployment configuration.}
  DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL SQLAlchemy URL in protected deployment configuration.}
  REDIS_URL: ${REDIS_URL:?Set the Redis database 0 URL in protected deployment configuration.}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?Set the Redis database 1 broker URL in protected deployment configuration.}

services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the PostgreSQL database name.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a protected PostgreSQL password.}
      POSTGRES_USER: ${POSTGRES_USER:?Set the PostgreSQL user.}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - private

  redis:
    image: redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a protected Redis password.}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--requirepass",
        "${REDIS_PASSWORD:?Set a protected Redis password.}",
      ]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - redis_data:/data
    networks:
      - private

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: voluma-api:${VOLUMA_IMAGE_TAG:-local}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-environment
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - media_data:/var/lib/voluma-media
    networks:
      - private

  provision-admin:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: voluma-api:${VOLUMA_IMAGE_TAG:-local}
    command: ["python", "-m", "app.commands.provision_initial_administrator"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      VOLUMA_INITIAL_ADMIN_EMAIL: ${VOLUMA_INITIAL_ADMIN_EMAIL-}
      VOLUMA_INITIAL_ADMIN_PASSWORD: ${VOLUMA_INITIAL_ADMIN_PASSWORD-}
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - media_data:/var/lib/voluma-media
    networks:
      - private

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: voluma-api:${VOLUMA_IMAGE_TAG:-local}
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/readyz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - media_data:/var/lib/voluma-media
    networks:
      - private

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: voluma-api:${VOLUMA_IMAGE_TAG:-local}
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - media_data:/var/lib/voluma-media
    networks:
      - private

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: voluma-frontend:${VOLUMA_IMAGE_TAG:-local}
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Next standalone otherwise inherits Docker's container hostname and does
      # not listen on the loopback interface used by its health check.
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      VOLUMA_API_BASE_URL: http://api:8000
      VOLUMA_PUBLIC_ORIGIN: ${VOLUMA_PUBLIC_ORIGIN:?Set the canonical HTTPS origin in protected deployment configuration.}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/admin/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - private

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    image: voluma-nginx:${VOLUMA_IMAGE_TAG:-local}
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - media_data:/var/lib/voluma-media:ro
      - type: bind
        source: ${VOLUMA_TLS_CERT_PATH:?Set the absolute path to the valid TLS certificate.}
        target: /etc/nginx/tls/fullchain.pem
        read_only: true
      - type: bind
        source: ${VOLUMA_TLS_KEY_PATH:?Set the absolute path to the protected TLS private key.}
        target: /etc/nginx/tls/privkey.pem
        read_only: true
    networks:
      - edge
      - private

volumes:
  media_data:
  postgres_data:
  redis_data:

networks:
  edge:
  private:
    internal: true
