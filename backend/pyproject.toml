[project]
name = "voluma-backend"
version = "0.1.0"
description = "VOLUMA content, administration, and media API"
readme = "README.md"
requires-python = "==3.14.7"
license = { text = "UNLICENSED" }
dependencies = [
  "alembic==1.19.2",
  "celery[redis]==5.6.3",
  "email-validator==2.3.0",
  "fastapi[standard]==0.141.1",
  "pillow==12.3.0",
  "pillow-avif-plugin==1.6.0",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.1",
  "python-multipart==0.0.32",
  "redis[hiredis]==6.4.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4"
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
