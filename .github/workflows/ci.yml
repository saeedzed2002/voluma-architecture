name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Validate the frontend from the lockfile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - name: Install and validate frontend from the lockfile
        working-directory: frontend
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm build
          corepack pnpm audit --prod --audit-level=high

  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
