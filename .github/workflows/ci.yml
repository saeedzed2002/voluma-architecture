name: Continuous integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# A newer commit supersedes an older validation run for the same branch or pull
# request. This never changes a deployed environment; it only frees a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application-checks:
    name: Validate application contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      DATABASE_URL: postgresql+psycopg://voluma:ci-only-postgres-password@127.0.0.1:5432/voluma
      REDIS_URL: redis://127.0.0.1:6379/0
      VOLUMA_INITIAL_ADMIN_EMAIL: e2e-administrator@example.com
      VOLUMA_INITIAL_ADMIN_PASSWORD: ci-only-administrator-password
      VOLUMA_MEDIA_ROOT: /tmp/voluma-media
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: voluma
          POSTGRES_USER: voluma
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voluma -d voluma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10.1@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - name: Install and validate frontend from the lockfile
        working-directory: frontend
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm build
          corepack pnpm audit --prod --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14.7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.12.9
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync backend from the lockfile
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Check backend formatting and lint
        working-directory: backend
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type-check the backend
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          if output="$(uv run mypy app 2>&1)"; then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            while IFS= read -r line; do
              printf '::error title=Backend type check failed::%s\n' "$line"
            done <<< "$output"
            exit 1
          fi

      - name: Run backend unit tests
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Validate migrations and seed commands
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run python -m app.fixtures.seed
          uv run python -m app.commands.provision_initial_administrator

      - name: Start API and media worker for browser checks
        working-directory: backend
        env:
          VOLUMA_PUBLIC_ORIGIN: http://127.0.0.1:3000
        run: |
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/voluma-api.log" 2>&1 &
          nohup uv run celery -A app.worker:celery_app worker --hostname=voluma-ci@%h --loglevel=warning --concurrency=1 > "$RUNNER_TEMP/voluma-worker.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/readyz && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/readyz
          for attempt in {1..30}; do
            if uv run celery -A app.worker:celery_app inspect ping --timeout=1 | grep --quiet pong; then
              break
            fi
            sleep 1
          done
          uv run celery -A app.worker:celery_app inspect ping --timeout=1 | grep --quiet pong

      - name: Run media worker integration checks through Redis
        working-directory: backend
        env:
          VOLUMA_RUN_MEDIA_WORKER_INTEGRATION: "1"
        run: uv run pytest tests/test_media_worker_integration.py -q

      - name: Run browser checks against the running API and worker
        working-directory: frontend
        env:
          VOLUMA_API_BASE_URL: http://127.0.0.1:8000
          VOLUMA_E2E_ADMIN_EMAIL: e2e-administrator@example.com
          VOLUMA_E2E_ADMIN_PASSWORD: ci-only-administrator-password
        shell: bash
        run: |
          set -o pipefail
          if output="$(corepack pnpm test:e2e 2>&1)"; then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            while IFS= read -r line; do
              printf '::error title=Browser integration check failed::%s\n' "$line"
            done <<< "$output"
            exit 1
          fi

      - name: Check whitespace errors
        run: git diff-tree --check --no-commit-id -r HEAD

      - name: Print API and worker logs after a failure
        if: failure()
        run: |
          cat "$RUNNER_TEMP/voluma-api.log" || true
          cat "$RUNNER_TEMP/voluma-worker.log" || true

  compose-smoke:
    name: Build and smoke the isolated container stack
    runs-on: ubuntu-24.04
    needs: application-checks
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: voluma-ci
      CELERY_BROKER_URL: redis://:ci-only-redis-password@redis:6379/1
      DATABASE_URL: postgresql+psycopg://voluma:ci-only-postgres-password@postgres:5432/voluma
      POSTGRES_DB: voluma
      POSTGRES_PASSWORD: ci-only-postgres-password
      POSTGRES_USER: voluma
      REDIS_PASSWORD: ci-only-redis-password
      REDIS_URL: redis://:ci-only-redis-password@redis:6379/0
      VOLUMA_ENVIRONMENT: production
      VOLUMA_IMAGE_TAG: ci
      VOLUMA_INITIAL_ADMIN_EMAIL: e2e-administrator@example.com
      VOLUMA_INITIAL_ADMIN_PASSWORD: ci-only-administrator-password
      VOLUMA_PUBLIC_ORIGIN: https://localhost
      VOLUMA_TLS_CERT_PATH: /tmp/voluma-tls/fullchain.pem
      VOLUMA_TLS_KEY_PATH: /tmp/voluma-tls/privkey.pem
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Generate CI-only TLS material
        run: |
          mkdir --parents /tmp/voluma-tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/voluma-tls/privkey.pem \
            -out /tmp/voluma-tls/fullchain.pem \
            -subj "/CN=localhost"

      - name: Build, migrate, and start the isolated stack
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Provision the CI-only administrator
        run: docker compose --profile bootstrap run --rm --no-deps provision-admin

      - name: Load CI-only representative content
        run: docker compose exec -T api python -m app.fixtures.seed

      - name: Smoke the HTTPS reverse proxy and BFF routes
        env:
          VOLUMA_SMOKE_ADMIN_EMAIL: e2e-administrator@example.com
          VOLUMA_SMOKE_ADMIN_PASSWORD: ci-only-administrator-password
          VOLUMA_SMOKE_ALLOW_INSECURE_TLS: "1"
        run: sh infra/scripts/release-smoke.sh

      - name: Set up the pinned Trivy scanner once
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: true

      - name: Scan API, frontend, and Nginx images for high and critical vulnerabilities
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
        run: |
          for image in voluma-api:ci voluma-frontend:ci voluma-nginx:ci; do
            trivy image \
              --exit-code 1 \
              --ignore-unfixed \
              --severity HIGH,CRITICAL \
              --pkg-types os,library \
              "$image"
          done

      - name: Print Compose logs after a failure
        if: failure()
        run: |
          docker compose ps || true
          for service in redis api frontend nginx; do
            container_id="$(docker compose ps -q "$service" || true)"
            if [ -n "$container_id" ]; then
              printf '\n%s healthcheck:\n' "$service"
              docker inspect --format '{{range .State.Health.Log}}{{.Output}}{{end}}' "$container_id" || true
            fi
          done
          docker compose logs --no-color || true

      - name: Stop the isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Scan repository history for secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
