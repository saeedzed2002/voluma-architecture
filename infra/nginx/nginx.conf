pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  gzip on;
  gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;
  gzip_vary on;

  upstream frontend_upstream {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  upstream api_upstream {
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 8080;
    server_name _;

    location = /nginx-healthz {
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 60m;

    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /nginx-healthz {
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    location = /api/v1/contact {
      # Browser contact submissions use the Next.js BFF so it can pass only the
      # origin and edge-sanitized client address to the private FastAPI service.
      proxy_pass http://frontend_upstream;
      include /etc/nginx/conf.d/proxy-headers.conf;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header Cache-Control "no-store" always;
    }

    location ^~ /api/v1/admin/ {
      # Keep administrator cookies and CSRF headers on the same-origin BFF route.
      proxy_pass http://frontend_upstream;
      include /etc/nginx/conf.d/proxy-headers.conf;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
      proxy_pass http://api_upstream;
      include /etc/nginx/conf.d/proxy-headers.conf;
      proxy_no_cache 1;
      proxy_cache_bypass 1;
      add_header Cache-Control "no-store" always;
    }

    include /etc/nginx/conf.d/media.conf;

    location / {
      proxy_pass http://frontend_upstream;
      include /etc/nginx/conf.d/proxy-headers.conf;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
