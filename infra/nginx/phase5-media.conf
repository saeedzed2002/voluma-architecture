events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 8080;
    server_name _;
    client_max_body_size 60m;

    location = /media {
      return 404;
    }

    location ~ "^/media/(?<media_id>[0-9a-f-]{36})/(?<version>[a-zA-Z0-9_-]{1,64})/(?<filename>(?:w(?:320|640|1024|1600|2400)\.(?:avif|webp)|placeholder\.webp|og\.webp))$" {
      alias /var/lib/voluma-media/public/$media_id/$version/$filename;
      autoindex off;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ { return 404; }

    location / {
      return 404;
    }
  }
}
